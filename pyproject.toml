[project]
name = "gpusentry"
version = "1.0.1"
description = "GPU monitoring and intelligent reporting system that combines nvitop's dashboard functionality with gpustat's beautiful display"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "paramiko>=4.0.0",
    "requests>=2.32.5",
    "gpustat>=1.1.0",
    "psutil>=6.0.0",
    "colorama>=0.4.6",
    "tabulate>=0.9.0",
    "sqlalchemy>=2.0.0",
    "pyyaml>=6.0",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Monitoring",
    "Topic :: Utilities",
]

[project.scripts]
gpusentry = "gpusentry.main:main"

[project.urls]
Homepage = "https://github.com/xiyuanyang-code/GPUSentry"
Repository = "https://github.com/xiyuanyang-code/GPUSentry"
Issues = "https://github.com/xiyuanyang-code/GPUSentry/issues"

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple"
default = true
